name: smart_measurer
description: >-
  Measure a widget's real size and react to it, with frame-accurate
  precision tracking and a zero-delay, size-aware decoration painter
  for pure-drawing use cases.
version: 0.1.0
homepage: https://github.com/MoshiDuck/smart_measurer
repository: https://github.com/MoshiDuck/smart_measurer
issue_tracker: https://github.com/MoshiDuck/smart_measurer/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# The pub.dev topics are chosen from an approved list.
# See https://pub.dev/topics for the latest available topics.
topics:
  - widgets
  - layout
  - rendering